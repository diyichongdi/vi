<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频大全 - Video Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 40px 20px;
            text-align: center;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header p {
            color: #888;
            font-size: 1rem;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .search-box {
            margin: 30px 0;
            text-align: center;
        }
        .search-box input {
            width: 100%;
            max-width: 600px;
            padding: 15px 25px;
            font-size: 16px;
            border: none;
            border-radius: 50px;
            background: #1a1a2e;
            color: #fff;
            outline: none;
            transition: all 0.3s;
        }
        .search-box input:focus {
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
        }
        .search-box input::placeholder {
            color: #666;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 10px 25px;
            background: #1a1a2e;
            border: none;
            border-radius: 25px;
            color: #888;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        .tab.active, .tab:hover {
            background: linear-gradient(90deg, #ff6b6b, #feca57);
            color: #fff;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }
        .video-card {
            background: #1a1a2e;
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.2);
        }
        .video-wrapper {
            position: relative;
            padding-top: 56.25%;
            background: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .video-info {
            padding: 15px;
        }
        .video-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-meta {
            display: flex;
            gap: 15px;
            color: #666;
            font-size: 13px;
        }
        .video-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            font-size: 14px;
        }
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }
            .video-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>视频大全</h1>
        <p>精选优质视频内容</p>
        <div class="search-box">
            <input type="text" id="search" placeholder="搜索视频..." oninput="filterVideos()">
        </div>
        <div class="tabs">

        </div>
    </div>
    <footer>
        <p>© 2026 Video Gallery - 仅供学习交流使用</p>
    </footer>

    <script>
        function filterVideos() {
            const search = document.getElementById('search').value.toLowerCase();
            const cards = document.querySelectorAll('.video-card');
            cards.forEach(card => {
                const title = card.dataset.title.toLowerCase();
                card.style.display = title.includes(search) ? 'block' : 'none';
            });
        }

        function filterCategory(category) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            const cards = document.querySelectorAll('.video-card');
            cards.forEach(card => {
                if (category === 'all' || card.dataset.category === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
