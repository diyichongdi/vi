<head>

<title>元素周期表 · 高中化学</title>
<style>
:root{
  --cell: clamp(42px, min(4.5vw, 7.3vh), 104px);
  --gap: clamp(3px, .42vw, 8px);
  --ink: #e8ecf7;
  --muted: #93a0bb;
  --glass: rgba(14,18,30,.62);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(1100px 760px at 18% 8%, #0c1730 0%, rgba(4,6,12,0) 62%),
    radial-gradient(900px 700px at 86% 92%, #08192a 0%, rgba(4,6,12,0) 60%),
    radial-gradient(700px 520px at 52% 42%, #0a1020 0%, rgba(4,6,12,0) 70%),
    #04060c;
  color:var(--ink);
  font-family:"Segoe UI","SimSun-ExtB","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC",sans-serif;
  overflow:hidden; user-select:none;
}
/* ===== HaloFlux 动态背景 ===== */
.halo-bg{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:-5;pointer-events:none;
  opacity:.8;mix-blend-mode:screen;filter:saturate(.55) contrast(1.05) brightness(.9) blur(1.8px);}
.halo-veil{position:fixed;inset:0;z-index:-4;pointer-events:none;background:
  radial-gradient(ellipse 78% 70% at 50% 46%,rgba(4,6,12,.60) 0%,rgba(4,6,12,.48) 44%,rgba(4,6,12,.28) 74%,rgba(4,6,12,.12) 100%),
  linear-gradient(180deg,rgba(4,6,12,.42),rgba(4,6,12,.12) 32%,rgba(4,6,12,.12) 68%,rgba(4,6,12,.48));}
.vignette{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.6) 100%);}

/* ===== 顶栏 ===== */
.wrap{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(12px,2.2vh,26px) clamp(10px,2vw,28px) 10px;}
.head{width:min(96vw,1780px);display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:clamp(8px,1.4vh,18px);}
.title{font-size:clamp(20px,2.5vw,34px);font-weight:800;letter-spacing:.06em;margin:0;
  background:linear-gradient(100deg,#a5b4fc,#67e8f9 45%,#f0abfc 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(99,102,241,.35));
}
.sub{font-size:clamp(10px,1vw,13px);color:var(--muted);letter-spacing:.14em;margin-top:4px;}
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;justify-content:flex-end;max-width:62%;}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:clamp(9px,.82vw,12px);color:#c7d2ea;background:rgba(8,12,22,.62);border:1px solid rgba(255,255,255,.09);padding:3px 9px;border-radius:999px;backdrop-filter:blur(6px);}
.dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 10px currentColor;}
.newtag{font-size:8px;padding:1px 4px;border-radius:4px;background:linear-gradient(90deg,#f472b6,#fb923c);color:#fff;margin-left:2px;letter-spacing:0;}

/* ===== 周期表 ===== */
.pt{display:grid;
  grid-template-columns:repeat(18,var(--cell));
  grid-template-rows:repeat(7,var(--cell)) 13px repeat(2,var(--cell));
  gap:var(--gap);
  justify-content:center;
}
.cell{
  position:relative;border-radius:9px;border:1px solid rgba(255,255,255,.085);
  background:linear-gradient(160deg,rgba(30,38,60,.86),rgba(13,18,32,.84) 55%,rgba(5,9,18,.9));
  color:var(--ink);cursor:pointer;padding:4px 5px;text-align:center;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s,border-color .22s,background .22s;
  opacity:0;transform:translateY(14px) scale(.97);
  animation:pop .5s cubic-bezier(.2,.7,.3,1) forwards;animation-delay:var(--d);
  will-change:transform,opacity;
}
.cell::before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:linear-gradient(90deg,transparent,var(--c),transparent);opacity:.55;}
.cell::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--c) 16%,transparent),transparent 60%);opacity:.55;pointer-events:none;}
@keyframes pop{to{opacity:1;transform:translateY(0) scale(1)}}
.cell .num{position:absolute;top:4px;left:6px;font-size:clamp(7px,.62vw,11px);color:#8b98b6;}
.cell .sym{position:relative;font-size:clamp(13px,1.42vw,27px);font-weight:800;line-height:1;letter-spacing:.02em;color:var(--c);text-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent);margin-top:2px;}
.cell .cn{position:relative;font-size:clamp(8px,.72vw,12px);color:#b9c4dc;margin-top:2px;white-space:nowrap;}
.cell .m{position:absolute;bottom:3px;right:6px;font-size:clamp(6px,.55vw,9px);color:#7f8bab;}
.cell.small .sym{font-size:clamp(10px,1.05vw,19px);}
.cell:hover{z-index:3;transform:translateY(-4px) scale(1.07);border-color:var(--c);
  box-shadow:0 0 0 1px var(--c),0 10px 34px color-mix(in srgb,var(--c) 38%,transparent),inset 0 0 22px color-mix(in srgb,var(--c) 16%,transparent);}
.cell.active{z-index:4;transform:translateY(-3px) scale(1.05);border-color:var(--c);
  box-shadow:0 0 0 1.5px var(--c),0 0 34px color-mix(in srgb,var(--c) 55%,transparent);}
.placeholder{
  grid-column:3;border-radius:9px;border:1px dashed rgba(255,255,255,.18);
  background:rgba(8,12,22,.55);color:#8ea0c4;font-size:clamp(8px,.72vw,12px);
  display:flex;align-items:center;justify-content:center;letter-spacing:.05em;
}
.fgap{grid-column:1/-1;grid-row:8;}
.blocklabel{grid-column:1/3;align-self:center;color:#6f7ea3;font-size:clamp(8px,.7vw,11px);letter-spacing:.12em;}

/* ===== 详情弹窗卡片 ===== */
.scrim{position:fixed;inset:0;background:rgba(2,4,9,.68);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40;}
.scrim.show{opacity:1;pointer-events:auto;}
.detail{
  position:fixed;left:50%;top:50%;z-index:50;
  width:min(760px,92vw);max-height:84vh;
  transform:translate(-50%,-50%) scale(.93);opacity:0;pointer-events:none;
  transition:transform .34s cubic-bezier(.22,.8,.28,1),opacity .28s ease;
  background:linear-gradient(165deg,rgba(21,27,45,.97),rgba(8,11,21,.98));
  border:1px solid rgba(255,255,255,.12);border-radius:18px;
  box-shadow:0 30px 90px rgba(0,0,0,.72),0 0 60px color-mix(in srgb,var(--c,#4dabf7) 10%,transparent);
  display:flex;flex-direction:column;overflow:hidden;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
}
.detail.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto;}
.d-accent{position:absolute;left:0;top:0;height:3px;width:100%;z-index:2;background:linear-gradient(90deg,var(--c,#4dabf7),transparent);}
.d-body{padding:18px 20px 22px;overflow-y:auto;flex:1;}
.d-top{display:flex;align-items:center;gap:16px;}
.d-sym{font-size:clamp(44px,5vw,64px);font-weight:900;line-height:.95;color:var(--c,#4dabf7);text-shadow:0 0 26px color-mix(in srgb,var(--c,#4dabf7) 55%,transparent);}
.d-id{flex:1;}
.d-cn{font-size:19px;font-weight:700;}
.d-en{font-size:12px;color:var(--muted);letter-spacing:.06em;}
.d-cat{display:inline-block;margin-top:6px;font-size:11px;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--c,#4dabf7) 18%,transparent);color:var(--c,#4dabf7);border:1px solid color-mix(in srgb,var(--c,#4dabf7) 40%,transparent);}
.d-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#cbd5ea;font-size:18px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;}
.d-close:hover{background:rgba(255,255,255,.12);}
.d-sec{margin-top:18px;}
.d-sec h3{font-size:11px;font-weight:600;letter-spacing:.16em;color:#7d8db3;margin:0 0 8px;text-transform:uppercase;}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;}
.kv .item{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);border-radius:9px;padding:7px 10px;}
.kv .k{font-size:10px;color:#7d8db3;}
.kv .v{font-size:13px;font-weight:600;margin-top:2px;word-break:break-word;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.tchip{font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#cdd7ee;}
.config{font-family:"Cascadia Code","Consolas",monospace;font-size:13px;line-height:1.6;color:#dbe6ff;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 12px;}
.shell{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.shell .k{font-size:11px;color:#8b9ab8;margin-right:2px;}
.shell .s{font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;background:color-mix(in srgb,var(--c,#4dabf7) 14%,transparent);color:color-mix(in srgb,var(--c,#4dabf7) 80%,#fff);border:1px solid color-mix(in srgb,var(--c,#4dabf7) 30%,transparent);}
.notes{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:7px;}
.notes li{font-size:12.5px;line-height:1.62;color:#cbd5ea;}
.notes li::marker{color:var(--c,#4dabf7);}
.uses{font-size:12.5px;line-height:1.7;color:#b7c2dc;}

.hint{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);font-size:11px;letter-spacing:.16em;color:#6d7a99;z-index:5;pointer-events:none;}
.count{position:fixed;right:22px;bottom:12px;font-size:11px;color:#5f6b8a;letter-spacing:.1em;z-index:5;}
.credit{position:fixed;left:20px;bottom:12px;font-size:10px;color:#5f6b8a;letter-spacing:.06em;z-index:5;pointer-events:auto;}
.credit a{color:#7d8db3;text-decoration:none;border-bottom:1px dotted rgba(125,141,179,.4);}

@media (max-width:760px){
  .legend{max-width:100%;justify-content:flex-start;}
  .detail{width:94vw;max-height:88vh;}
  .cell .m{display:none;}
}
@media (prefers-reduced-motion:reduce){
  .cell{animation:none;opacity:1;transform:none;}
}
</style>

&lt;html lang=&quot;en&quot;&gt;

&lt;title&gt;HALOFLUX&lt;/title&gt;
&lt;style&gt;
:root{
  --bg:#08090b; --panel:#0e0f12; --line:#25282e; --line2:#3a3e46;
  --text:#cfd2d8; --dim:#6b6f78; --faint:#3f434a; --white:#f4f5f7;
  --pink:#f0a6c6; --teal:#98e0cf;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:ui-monospace,&quot;Cascadia Mono&quot;,&quot;SF Mono&quot;,Consolas,&quot;Liberation Mono&quot;,monospace;overflow:hidden}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh}

/* ---------- header ---------- */
header{display:grid;grid-template-columns:minmax(240px,1.7fr) repeat(5,minmax(0,1fr));align-items:end;border-bottom:1px solid var(--line);padding:10px 18px 0;background:#0a0b0d}
.brand h1{white-space:nowrap;margin:0;font-size:21px;font-weight:800;letter-spacing:1.5px;color:var(--white)}
.brand p{margin:3px 0 9px;font-size:9px;color:var(--dim);letter-spacing:1.2px}
.kpi{padding:0 10px 9px;position:relative}
.kpi .k{font-size:9px;color:var(--dim);letter-spacing:1.2px}
.kpi .v{font-size:14px;font-weight:800;color:var(--white);font-variant-numeric:tabular-nums}
.kpi .v.pink{color:var(--pink)}
.kpi .seg{position:absolute;left:10px;right:0;bottom:-1px;height:2px;background:var(--line)}
.kpi .seg i{display:block;height:100%;background:var(--text);width:0;transition:width 1.2s ease}

/* ---------- stage ---------- */
.stage{position:relative;min-height:0;overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage::after{content:&quot;&quot;;position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),
             radial-gradient(ellipse at 40% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
.ov{position:absolute;font-size:9px;letter-spacing:1px;color:var(--text);pointer-events:none;z-index:2}
.chk{left:0;top:0;will-change:transform;background:rgba(8,9,11,.85);border:1px solid var(--line2);padding:5px 8px;transition:opacity .4s}
.chk b{display:block;font-size:8px;color:var(--dim);font-weight:600;margin-bottom:3px}
.chk span{font-size:12px;color:var(--white);font-weight:600;white-space:nowrap}
.console{top:10px;right:14px;border:1px solid var(--line2);padding:3px 8px;background:rgba(8,9,11,.8)}
.music{top:10px;right:104px;z-index:3;pointer-events:auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line2);padding:2px 8px;background:rgba(8,9,11,.8);user-select:none}
.music .mbtn{cursor:pointer;display:flex;align-items:center;gap:5px}
.music:hover{border-color:#cfd2d8}
.music .mbtn:hover em{color:#fff}
.music em{font-style:normal;white-space:nowrap}
.music.on em{color:var(--white)}
.music.wait em{animation:bl 1s steps(1) infinite}
.music .eq{display:inline-flex;align-items:flex-end;gap:1px;height:8px}
.music .eq b{display:block;width:2px;height:2px;background:var(--dim)}
.music.on .eq b{background:var(--white);animation:eqb .9s ease-in-out infinite}
.music.on .eq b:nth-child(2){animation-delay:-.3s}
.music.on .eq b:nth-child(3){animation-delay:-.6s}
@keyframes eqb{0%,100%{height:2px}50%{height:8px}}
.music input[type=range]{width:70px;height:10px;margin:0;accent-color:#cfd2d8;cursor:pointer}
.music .mval{width:16px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.status{right:16px;bottom:12px;text-align:right}
.status .big{font-size:11px;color:var(--white);font-weight:800}
.status .sm{color:var(--dim);font-size:8px;margin-top:2px}

/* ---------- panels ---------- */
.panels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:8px 12px 12px;border-top:1px solid var(--line);background:#0a0b0d}
.p{border:1px solid var(--line);background:var(--panel);padding:7px 10px 6px;height:clamp(118px,17vh,168px);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.p h3{margin:0 0 5px;font-size:9px;font-weight:800;letter-spacing:1.3px;color:var(--white);white-space:nowrap}
.p .cap{margin-top:auto;font-size:8px;color:var(--dim);padding-top:3px;white-space:nowrap;overflow:hidden}
.p canvas{width:100%;flex:1;min-height:0;display:block}

.feed{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;font-size:9px;line-height:1.4;overflow:hidden}
.feed div{white-space:nowrap;color:var(--dim)}
.feed div:last-child{color:var(--white);font-weight:600}
.n{color:var(--faint);margin-right:8px}
.vb{display:inline-block;width:42px;font-weight:800}
.vb.build{color:var(--pink)} .vb.check{color:var(--text)} .vb.read{color:var(--teal)} .vb.qa{color:var(--white)}

.btns{display:flex;gap:4px;margin-top:4px}
.btns span{flex:1;font-size:8px;border:1px solid var(--line2);padding:1px 5px;color:var(--dim);transition:all .3s}
.btns span.on{background:#cfd2d8;color:#000;border-color:#cfd2d8}

.code{flex:1;min-height:0;font-size:9px;line-height:1.45;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.code div{white-space:nowrap}
.code .ln{color:var(--faint);margin-right:10px}
.code .fn{color:var(--white);font-weight:800}
.code .op{color:var(--dim)}
.caret{display:inline-block;width:6px;height:10px;background:var(--white);vertical-align:-1px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}

.routes{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:3px 6px;font-size:8px;align-content:start}
.routes .h{color:var(--dim);font-weight:800;letter-spacing:1px}
.routes .nm{color:var(--text);white-space:nowrap;overflow:hidden}
.chip{display:inline-block;padding:0 4px;border:1px solid var(--line2);border-radius:2px;color:var(--faint);line-height:11px;transition:all .3s}
.chip.on{background:#d6d8dd;color:#000;border-color:#d6d8dd}
.chip.done{background:#2b2e34;color:var(--text);border-color:#2b2e34}
.chip.pk{background:rgba(240,166,198,.25);color:var(--pink);border-color:rgba(240,166,198,.5)}

.agents{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:8px;align-content:start}
.ag{display:flex;align-items:center;gap:5px;white-space:nowrap}
.ag .id{color:var(--faint)} .ag .rl{width:36px;color:var(--text);font-weight:600}
.ag .cells{display:flex;gap:1px}
.ag .cells i{width:7px;height:7px;background:#1d1f24}
.ag .st{color:var(--dim);overflow:hidden}
.ag .st.w{color:var(--white)}

@media (max-width:1000px){
  html,body{overflow:auto}
  .app{height:auto}
  .stage{height:62vh}
  header{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 0}
  .brand{grid-column:1/-1}
  .panels{grid-template-columns:repeat(2,minmax(0,1fr))}
  .p{height:150px}
}
@media (max-width:520px){
  header{padding:10px 16px 0}
  .panels{grid-template-columns:minmax(0,1fr);padding:8px 16px 16px}
}
&lt;/style&gt;

html,body{background:#04060a!important;overflow:hidden!important;margin:0!important;}

  if (rot.t &gt;= rot.dur &amp;&amp; rot.hold &lt;= 0) ringMove();

  const n = Math.round((beatN % 4 === 0 ? C.cometBurst : C.cometPerBeat) * rr(0.6, 1.4));

  try { if (navigator.audioSession) navigator.audioSession.type = &#x27;playback&#x27;; } catch (e) {}   // iOS: play even with the silent switch on

  const roVolume = (() =&gt; { try { au.volume = 0.5; const ro = Math.abs(au.volume - 0.5) &gt; 0.01; au.volume = 1; return ro; } catch (e) { return true; } })();
  const AC = window.AudioContext || window.webkitAudioContext;
  const useWA = roVolume &amp;&amp; !!AC &amp;&amp; /^https?:$/.test(location.protocol);
  let ctx = null, gain = null;
  function graph() {
    if (!useWA || ctx) return;
    try {
      ctx = new AC(); gain = ctx.createGain(); gain.gain.value = 0;
      ctx.createMediaElementSource(au).connect(gain); gain.connect(ctx.destination);
    } catch (e) { ctx = null; gain = null; }

  const getV = () =&gt; gain ? gain.gain.value : au.volume;

  function fadeTo(to, ms, done) {
    cancelAnimationFrame(fadeRaf);

    const step = now =&gt; {

      setV(from + (to - from) * k);
      if (k &lt; 1) fadeRaf = requestAnimationFrame(step); else if (done) done();
    };
    fadeRaf = requestAnimationFrame(step);
  }
  const playing = () =&gt; !au.paused &amp;&amp; (!ctx || ctx.state === &#x27;running&#x27;);
  function ui(wait) {
    box.classList.toggle(&#x27;on&#x27;, st.on &amp;&amp; playing());
    box.classList.toggle(&#x27;wait&#x27;, !!wait);
    txt.textContent = wait ? (TOUCH ? &#x27;TAP TO PLAY&#x27; : &#x27;CLICK TO PLAY&#x27;) : st.on &amp;&amp; playing() ? &#x27;BGM ON&#x27; : &#x27;BGM OFF&#x27;;
    vol.value = st.vol; val.textContent = st.vol;
  }

  // first-gesture unlock
  const EVT = [&#x27;pointerdown&#x27;, &#x27;touchend&#x27;, &#x27;click&#x27;, &#x27;keydown&#x27;];
  let armed = false;
  const kick = e =&gt; {
    if (box.contains(e.target) || e.key === &#x27;m&#x27; || e.key === &#x27;M&#x27;) return;

  };

    if (on === armed) return; armed = on;

  }

  // pause in background tabs / when the phone locks, resume on return
  document.addEventListener(&#x27;visibilitychange&#x27;, () =&gt; {
    if (document.hidden) { if (!au.paused) { cancelAnimationFrame(fadeRaf); au.pause(); } }

    set(on) { st.on = !!on; if (st.on) play(); else stop(); ui(); },
    setVol(v) { st.vol = Math.max(0, Math.min(100, Math.round(v))); if (playing()) { setV(target()); } ui(); },
    kick() { if (st.on &amp;&amp; !playing()) play(); },

  };
})();

const CATLABEL = {"alkali":"碱金属","alkaline":"碱土金属","transition":"过渡金属","posttrans":"其他金属","metalloid":"准金属","nonmetal":"非金属","halogen":"卤素","noble":"稀有气体","lanthanide":"镧系","actinide":"锕系"};
const COLORS = {"alkali": "#ff6b81", "alkaline": "#ffa94d", "transition": "#4dabf7", "posttrans": "#20c997", "metalloid": "#9775fa", "nonmetal": "#51cf66", "halogen": "#fcc419", "noble": "#22b8cf", "lanthanide": "#e64980", "actinide": "#e8590c"};

/* ===== 构建周期表 ===== */
const pt = document.getElementById('pt');
const legend = document.getElementById('legend');
Object.entries(CATLABEL).forEach(([k,v])=>{
  const c = document.createElement('span'); c.className='chip';
  c.innerHTML = `<span class="dot" style="background:${COLORS[k]};color:${COLORS[k]}"></span>${v}`;
  legend.appendChild(c);
});

ELEMENTS.forEach((el, i)=>{
  const btn = document.createElement('button');
  btn.className = 'cell';
  btn.dataset.z = el.z;
  btn.style.gridColumn = el.col;
  btn.style.gridRow = el.row;
  btn.style.setProperty('--c', COLORS[el.cat]);
  btn.style.setProperty('--d', (i*14)+'ms');
  btn.setAttribute('aria-label', `${el.z} ${el.cn} ${el.sym}`);
  btn.innerHTML = `<span class="num">${el.z}</span><span class="sym">${el.sym}</span><span class="cn">${el.cn}${el.new?'<span class="newtag">新</span>':''}</span><span class="m">${el.mass}</span>`;
  btn.addEventListener('click', ()=>openDetail(el.z));
  pt.appendChild(btn);
});

/* 镧系/锕系占位 + 间隔 */
const ph1 = document.createElement('div'); ph1.className='placeholder'; ph1.style.gridRow=6; ph1.textContent='57–71 镧系';
const ph2 = document.createElement('div'); ph2.className='placeholder'; ph2.style.gridRow=7; ph2.textContent='89–103 锕系';
const gap = document.createElement('div'); gap.className='fgap';
pt.append(ph1, ph2, gap);
document.getElementById('cnt').textContent = ELEMENTS.length;

/* ===== 详情 ===== */
const detail = document.getElementById('detail');
const scrim = document.getElementById('scrim');
const dBody = document.getElementById('dBody');
const dAccent = document.getElementById('dAccent');
let activeCell = null;

function openDetail(z){
  const el = ELEMENTS.find(e=>e.z===z);
  if(!el) return;
  const c = COLORS[el.cat];
  detail.style.setProperty('--c', c);
  dAccent.style.background = `linear-gradient(90deg,${c},transparent)`;
  const newBadge = el.new ? `<span class="newtag">最新命名</span>` : '';
  dBody.innerHTML = `
    <div class="d-top">
      <div class="d-sym">${el.sym}</div>
      <div class="d-id">
        <div class="d-cn">${el.cn} ${newBadge}</div>
        <div class="d-en">${el.en}</div>
        <div class="d-cat">${CATLABEL[el.cat]}</div>
      </div>
    </div>
    <div class="d-sec">
      <h3>基本信息</h3>
      <div class="kv">
        <div class="item"><div class="k">原子序数</div><div class="v">${el.z}</div></div>
        <div class="item"><div class="k">相对原子质量</div><div class="v">${el.mass}</div></div>
        <div class="item"><div class="k">周期 / 族</div><div class="v">第 ${el.period} 周期 · ${el.glabel}族</div></div>
        <div class="item"><div class="k">元素分区</div><div class="v">${el.block} 区</div></div>
        <div class="item"><div class="k">常见化合价</div><div class="v">${el.ox}</div></div>
        <div class="item"><div class="k">常温状态</div><div class="v">${el.state}</div></div>
      </div>
    </div>
    <div class="d-sec">
      <h3>电子排布</h3>
      <div class="config">${el.config}</div>
      <div class="shell">${el.shells.map((n,i)=>`<span class="k">${'KLMNOPQ'[i]}</span><span class="s">${n}</span>`).join('')}</div>
    </div>
    <div class="d-sec">
      <h3>物理性质</h3>
      <div class="kv">
        <div class="item"><div class="k">熔点</div><div class="v">${el.mp}</div></div>
        <div class="item"><div class="k">沸点</div><div class="v">${el.bp}</div></div>
        <div class="item"><div class="k">密度</div><div class="v">${el.density}</div></div>
        <div class="item"><div class="k">电负性(Pauling)</div><div class="v">${el.eneg}</div></div>
      </div>
    </div>
    <div class="d-sec">
      <h3>高中化学要点</h3>
      <ul class="notes">${el.notes.map(n=>`<li>${n}</li>`).join('')}</ul>
    </div>
    <div class="d-sec">
      <h3>主要用途</h3>
      <div class="uses">${el.uses}</div>
    </div>`;
  detail.classList.add('open');
  detail.setAttribute('aria-hidden','false');
  scrim.classList.add('show');
  if(activeCell) activeCell.classList.remove('active');
  activeCell = [...pt.querySelectorAll('.cell')].find(b=>+b.dataset.z===z);
  if(activeCell) activeCell.classList.add('active');
}

function closeDetail(){
  detail.classList.remove('open');
  detail.setAttribute('aria-hidden','true');
  scrim.classList.remove('show');
  if(activeCell){activeCell.classList.remove('active');activeCell=null;}
}
document.getElementById('dClose').addEventListener('click', closeDetail);
scrim.addEventListener('click', closeDetail);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDetail(); });
